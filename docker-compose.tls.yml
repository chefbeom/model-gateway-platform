services:
  nginx:
    ports:
      - "443:443"
    volumes:
      - ./infra/nginx/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:?set TLS_CERT_FILE in .env}:/etc/nginx/tls/tls.crt:ro
      - ${TLS_KEY_FILE:?set TLS_KEY_FILE in .env}:/etc/nginx/tls/tls.key:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
