components:
  securitySchemes:
    ProjectApiKey: { type: http, scheme: bearer, bearerFormat: sk_llmg_... }
    AdminBearer: { type: http, scheme: bearer, bearerFormat: signed access token }
    BreakGlassAdmin: { type: apiKey, in: header, name: X-Admin-Token }
  parameters:
    OrganizationId: { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    NodeId: { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
    EndpointId: { name: endpointId, in: path, required: true, schema: { type: string, format: uuid } }
    ServiceId: { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, format: email, maxLength: 320 }
              password: { type: string, minLength: 12, maxLength: 128 }
  responses:
    AuthSession:
      description: Access token plus a Secure HttpOnly refresh cookie
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken: { type: string }
              user: { type: object, additionalProperties: true }
    EntityCreated:
      description: Created entity
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties: { id: { type: string, format: uuid } }
            additionalProperties: true
    ApiError:
      description: Control-plane error
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    OpenAiError:
      description: OpenAI-compatible error
      content: { application/json: { schema: { $ref: '#/components/schemas/OpenAiError' } } }
  schemas:
    ServiceFlowLayout:
      type: object
      required: [version, viewport, nodes]
      properties:
        version: { type: integer, enum: [1] }
        viewport:
          type: object
          required: [x, y, zoom]
          properties:
            x: { type: number, minimum: -1000000, maximum: 1000000 }
            y: { type: number, minimum: -1000000, maximum: 1000000 }
            zoom: { type: number, minimum: 0.1, maximum: 4 }
        nodes:
          type: object
          maxProperties: 500
          description: Keyed by node id (service, guardrail, prompt, cache, router, masker, or kind:id).
          additionalProperties:
            type: object
            required: [x, y]
            properties:
              x: { type: number, minimum: -1000000, maximum: 1000000 }
              y: { type: number, minimum: -1000000, maximum: 1000000 }
              collapsed: { type: boolean, description: Present only when true. }
    ServiceFlowLayoutView:
      type: object
      required: [serviceId, revision]
      properties:
        serviceId: { type: string, format: uuid }
        revision: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
        layout: { $ref: '#/components/schemas/ServiceFlowLayout' }
    ApiError:
      type: object
      required: [code, message]
      properties: { code: { type: string }, message: { type: string } }
    OpenAiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code]
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: string }
            request_id: { type: [string, 'null'] }
    ModelList:
      type: object
      required: [object, data]
      properties:
        object: { const: list }
        data:
          type: array
          items:
            type: object
            required: [id, object]
            properties:
              id: { type: string, description: Logical service key }
              object: { const: model }
              owned_by: { type: string }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string, description: Logical service key, examples: [text-pro] }
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [system, user, assistant, tool] }
              content: {}
            additionalProperties: true
        stream: { type: boolean, default: false }
        max_tokens: { type: integer, minimum: 1 }
        temperature: { type: number }
        response_format: { type: object, additionalProperties: true }
        tools: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: true
    CreateNode:
      type: object
      required: [organizationId, name]
      properties:
        organizationId: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        description: { type: [string, 'null'] }
        connectionMode: { type: string, enum: [DIRECT, AGENT], default: DIRECT }
        labelsJson: { type: [string, 'null'] }
    RegisterAccelerator:
      type: object
      required: [deviceIndex]
      properties:
        vendor: { type: [string, 'null'] }
        productName: { type: [string, 'null'], description: Free-form metadata, never a routing enum }
        deviceIndex: { type: integer, minimum: 0 }
        deviceUuid: { type: [string, 'null'] }
        memoryTotalMb: { type: [integer, 'null'], minimum: 1 }
        driverVersion: { type: [string, 'null'] }
        metadataJson: { type: [string, 'null'] }
    CreateRuntimeEndpoint:
      type: object
      required: [nodeId, runtimeType, baseUrl]
      properties:
        nodeId: { type: string, format: uuid }
        runtimeType: { type: string, enum: [LM_STUDIO, OLLAMA, LLAMA_CPP, OPENAI_COMPATIBLE] }
        baseUrl: { type: string, format: uri, examples: ['http://gpu-node-01:1234'] }
        apiToken: { type: [string, 'null'], writeOnly: true }
    CreateModelDeployment:
      type: object
      required: [runtimeEndpointId, providerModelId, displayName]
      properties:
        runtimeEndpointId: { type: string, format: uuid }
        providerModelId: { type: string, maxLength: 500 }
        compatibilityKey:
          type: [string, 'null']
          maxLength: 500
          description: Defaults to providerModelId; identical values declare STRICT failover equivalence.
        displayName: { type: string, maxLength: 200 }
        modelFamily: { type: [string, 'null'] }
        quantization: { type: [string, 'null'] }
        contextLength: { type: [integer, 'null'], minimum: 1 }
        maxConcurrency: { type: [integer, 'null'], minimum: 1, default: 1 }
        capabilitiesJson: { type: string, default: '[]' }
    CreateLogicalService:
      type: object
      required: [organizationId, serviceKey, displayName]
      properties:
        organizationId: { type: string, format: uuid }
        serviceKey: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,119}$' }
        displayName: { type: string }
        failoverPolicy:
          type: string
          enum: [STRICT, COMPATIBLE, DEGRADED]
          default: STRICT
          description: Controls which attached deployment models may replace the primary.
        retryPolicy:
          type: string
          enum: [SAFE, AGGRESSIVE]
          default: SAFE
          description: Controls whether an ambiguous or acknowledged upstream request may be replayed.
        allowDegraded: { type: boolean, default: false }
        requiredCapabilitiesJson: { type: string, default: '[]' }
        inputPricePerMillion: { type: number, minimum: 0 }
        outputPricePerMillion: { type: number, minimum: 0 }
        temperaturePolicy:
          type: string
          enum: [REQUEST, FIXED, OMIT]
          default: REQUEST
          description: Preserve the incoming value, override it with temperatureValue, or omit it so each target uses its default.
        temperatureValue: { type: [number, 'null'], minimum: 0, maximum: 2, description: Required when temperaturePolicy is FIXED. }
        reasoningEffort:
          type: string
          enum: [REQUEST, NONE, MINIMAL, LOW, MEDIUM, HIGH, XHIGH, MAX]
          default: REQUEST
          description: For external OpenAI-compatible Targets, REQUEST preserves the incoming value/model default; other values are sent as Chat Completions reasoning_effort. Support is model-dependent.
        openAiFastMode:
          type: boolean
          default: false
          description: When true, external OpenAI-compatible Target requests include service_tier=fast. Availability and pricing depend on the provider, model, and project.
    UpdateLogicalService:
      type: object
      properties:
        displayName: { type: string, maxLength: 200 }
        failoverPolicy: { type: string, enum: [STRICT, COMPATIBLE, DEGRADED] }
        retryPolicy: { type: string, enum: [SAFE, AGGRESSIVE] }
        allowDegraded: { type: boolean }
        requiredCapabilitiesJson: { type: string }
        inputPricePerMillion: { type: number, minimum: 0 }
        outputPricePerMillion: { type: number, minimum: 0 }
        currency: { type: string, enum: [KRW, USD] }
        enabled: { type: boolean }
        temperaturePolicy:
          type: string
          enum: [REQUEST, FIXED, OMIT]
          description: REQUEST preserves existing behavior; FIXED overwrites caller input; OMIT uses the target model default.
        temperatureValue: { type: [number, 'null'], minimum: 0, maximum: 2, description: Required when temperaturePolicy is FIXED. }
        reasoningEffort:
          type: string
          enum: [REQUEST, NONE, MINIMAL, LOW, MEDIUM, HIGH, XHIGH, MAX]
          description: For external OpenAI-compatible Targets, REQUEST preserves the incoming value/model default; other values are sent as Chat Completions reasoning_effort. Support is model-dependent.
        openAiFastMode:
          type: boolean
          description: When true, external OpenAI-compatible Target requests include service_tier=fast. When false, incoming/provider defaults are preserved.
    CreateServiceTarget:
      type: object
      required: [deploymentId, priority]
      properties:
        deploymentId: { type: string, format: uuid }
        priority: { type: integer, minimum: 1 }
        weight: { type: integer, minimum: 1, default: 100 }
        degraded: { type: boolean, default: false }
        maxConcurrencyOverride: { type: [integer, 'null'], minimum: 1 }
        followModelChanges:
          type: boolean
          default: true
          description: Automatically move this Target to an unambiguous replacement Deployment when the same runtime model changes.
