openapi: 3.1.0
info:
  title: AIConnect LLM Service Platform API
  version: 0.3.0
  description: Hardware-independent LLM control plane and OpenAI-compatible data plane.
servers:
  - url: https://llm.example.com
tags:
  - name: OpenAI compatible
  - name: Authentication
  - name: Control plane
  - name: Usage
paths:
  /v1/models:
    get:
      tags: [OpenAI compatible]
      summary: List logical models available to the project API key
      security: [{ ProjectApiKey: [] }]
      responses:
        '200':
          description: Logical model list
          content: { application/json: { schema: { $ref: '#/components/schemas/ModelList' } } }
        '401': { $ref: '#/components/responses/OpenAiError' }
  /v1/chat/completions:
    post:
      tags: [OpenAI compatible]
      summary: Route an OpenAI-compatible completion through the logical service policy
      security: [{ ProjectApiKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChatCompletionRequest' } } }
      responses:
        '200':
          description: Completion JSON or SSE when stream=true
          headers: { X-Request-Id: { schema: { type: string } } }
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
            text/event-stream: { schema: { type: string } }
        '401': { $ref: '#/components/responses/OpenAiError' }
        '403': { $ref: '#/components/responses/OpenAiError' }
        '429': { $ref: '#/components/responses/OpenAiError' }
        '502': { $ref: '#/components/responses/OpenAiError' }
        '503': { $ref: '#/components/responses/OpenAiError' }
  /api/auth/bootstrap:
    post:
      tags: [Authentication]
      summary: Create the first platform administrator
      requestBody: { $ref: '#/components/requestBodies/Credentials' }
      responses: { '200': { $ref: '#/components/responses/AuthSession' }, '409': { $ref: '#/components/responses/ApiError' } }
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login and set an HttpOnly refresh cookie
      requestBody: { $ref: '#/components/requestBodies/Credentials' }
      responses: { '200': { $ref: '#/components/responses/AuthSession' }, '401': { $ref: '#/components/responses/ApiError' } }
  /api/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate the refresh token
      responses: { '200': { $ref: '#/components/responses/AuthSession' }, '401': { $ref: '#/components/responses/ApiError' } }
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the refresh token
      responses: { '204': { description: Logged out } }
  /api/admin/deployment-profile:
    get:
      tags: [Control plane]
      summary: Inspect the active deployment and shared-state profile
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      responses:
        '200':
          description: Active Standalone, HA, or Kubernetes profile
          content:
            application/json:
              schema:
                type: object
                required: [profile, sharedStateProvider, instanceId, redisConfigured]
                properties:
                  profile: { type: string, enum: [STANDALONE, HA, KUBERNETES] }
                  sharedStateProvider: { type: string, enum: [LOCAL, REDIS] }
                  instanceId: { type: string }
                  redisConfigured: { type: boolean }
  /api/admin/organizations:
    get:
      tags: [Control plane]
      summary: List all organizations for a platform administrator or membership-scoped organizations for another administrator
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      responses: { '200': { description: Accessible organizations } }
    post:
      tags: [Control plane]
      summary: Create an organization
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, maxLength: 120 } }
      responses: { '200': { $ref: '#/components/responses/EntityCreated' } }
  /api/admin/overview:
    get:
      tags: [Observability]
      summary: Get platform-wide 24-hour operations overview
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      responses: { '200': { description: Requests, rates, p95 latency, tokens, cost, failovers, endpoints and incidents } }
  /api/admin/organizations/{organizationId}/overview:
    get:
      tags: [Observability]
      summary: Get organization-scoped 24-hour operations overview
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { description: Organization operations overview } }
  /api/admin/organizations/{organizationId}/projects:
    get:
      tags: [Control plane]
      summary: List projects in an authorized organization
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { description: Organization project list } }
  /api/admin/projects:
    post:
      tags: [Control plane]
      summary: Create an organization project
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, name]
              properties:
                organizationId: { type: string, format: uuid }
                name: { type: string, maxLength: 120 }
      responses: { '200': { $ref: '#/components/responses/EntityCreated' } }
  /api/admin/nodes:
    post:
      tags: [Control plane]
      summary: Register a hardware-independent inference node
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateNode' } } }
      responses: { '200': { $ref: '#/components/responses/EntityCreated' } }
  /api/admin/nodes/{nodeId}/accelerators:
    parameters: [{ $ref: '#/components/parameters/NodeId' }]
    get:
      tags: [Control plane]
      summary: List optional accelerator metadata
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      responses: { '200': { description: Accelerator list } }
    post:
      tags: [Control plane]
      summary: Register free-form accelerator metadata
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterAccelerator' } } }
      responses: { '200': { $ref: '#/components/responses/EntityCreated' } }
  /api/admin/runtime-endpoints:
    get:
      tags: [Control plane]
      summary: List all endpoints as platform administrator
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      responses: { '200': { description: Runtime endpoint list } }
    post:
      tags: [Control plane]
      summary: Register an LM Studio endpoint
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateRuntimeEndpoint' } } }
      responses:
        '200': { $ref: '#/components/responses/EntityCreated' }
        '400': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/admin/organizations/{organizationId}/runtime-endpoints:
    get:
      tags: [Control plane]
      summary: List endpoints in an authorized organization
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { description: Organization endpoint list } }
  /api/admin/model-deployments:
    post:
      tags: [Control plane]
      summary: Register a deployment and optional administrator-validated compatibility key
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateModelDeployment' } } }
      responses: { '200': { $ref: '#/components/responses/EntityCreated' } }
  /api/admin/runtime-endpoints/{endpointId}/probe:
    post:
      tags: [Control plane]
      summary: Probe LM Studio and list provider model IDs
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/EndpointId' }]
      responses: { '200': { description: Probe result } }
  /api/admin/runtime-endpoints/{endpointId}/sync-models:
    post:
      tags: [Control plane]
      summary: Discover unknown model deployments
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/EndpointId' }]
      responses: { '200': { description: Newly discovered deployments } }
  /api/admin/runtime-endpoints/{endpointId}/drain:
    post:
      tags: [Control plane]
      summary: Stop routing new requests while in-flight work finishes
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/EndpointId' }]
      responses: { '200': { description: Endpoint state } }
  /api/admin/runtime-endpoints/{endpointId}/resume:
    post:
      tags: [Control plane]
      summary: Probe and warm up before restoring routing
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/EndpointId' }]
      responses: { '200': { description: Endpoint state } }
  /api/admin/services:
    post:
      tags: [Control plane]
      summary: Create a logical service with compatibility and replay policies
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateLogicalService' } } }
      responses: { '200': { $ref: '#/components/responses/EntityCreated' } }
  /api/admin/services/{serviceId}:
    patch:
      tags: [Control plane]
      summary: Update logical service and request parameter policies
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/ServiceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateLogicalService' } } }
      responses: { '200': { description: Updated service policy } }
  /api/admin/services/{serviceId}/flow-layout:
    get:
      tags: [Control plane]
      summary: Get the saved service flow designer canvas layout
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/ServiceId' }]
      responses:
        '200': { description: 'Saved layout (revision 0 and no layout when none is stored)', content: { application/json: { schema: { $ref: '#/components/schemas/ServiceFlowLayoutView' } } } }
        '404': { description: SERVICE_NOT_FOUND }
    put:
      tags: [Control plane]
      summary: Save the service flow designer canvas layout (node ids, coordinates, viewport only)
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/ServiceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ServiceFlowLayout' } } }
      responses:
        '200': { description: 'Saved layout with incremented revision', content: { application/json: { schema: { $ref: '#/components/schemas/ServiceFlowLayoutView' } } } }
        '400': { description: FLOW_LAYOUT_INVALID or FLOW_LAYOUT_TOO_LARGE }
        '404': { description: SERVICE_NOT_FOUND }
  /api/admin/services/{serviceId}/targets:
    post:
      tags: [Control plane]
      summary: Attach a prioritized, weighted deployment target
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/ServiceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateServiceTarget' } } }
      responses: { '200': { $ref: '#/components/responses/EntityCreated' } }
  /api/admin/projects/{projectId}/service-access:
    post:
      tags: [Control plane]
      summary: Grant project access to a logical service
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses: { '200': { description: Access granted } }
  /api/admin/projects/{projectId}/api-keys:
    get:
      tags: [Control plane]
      summary: List API-key metadata without raw secrets
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses: { '200': { description: API-key metadata } }
    post:
      tags: [Control plane]
      summary: Issue an API key; the raw secret is returned once
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                expiresAt: { type: [string, 'null'], format: date-time }
      responses: { '200': { description: One-time API-key response } }
  /api/admin/projects/{projectId}/quota:
    put:
      tags: [Control plane]
      summary: Set RPM and monthly token quota
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses: { '200': { description: Applied quota } }
  /api/admin/projects/{projectId}/content-policy:
    put:
      tags: [Control plane]
      summary: Set request-content retention policy
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses: { '200': { description: Applied content policy } }
  /api/admin/organizations/{organizationId}/notification-channels:
    get:
      tags: [Control plane]
      summary: List organization notification channels without returning encrypted credentials
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { description: Notification channel states } }
    post:
      tags: [Control plane]
      summary: Add a Discord or Telegram incident channel
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { $ref: '#/components/responses/EntityCreated' } }
  /api/admin/organizations/{organizationId}/notification-channels/{channelId}:
    patch:
      tags: [Control plane]
      summary: Enable or disable an organization notification channel
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses:
        '200': { description: Updated notification channel state }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/admin/organizations/{organizationId}/incidents:
    get:
      tags: [Control plane]
      summary: List organization incidents and notification delivery outcomes
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, RECOVERED] } }
      responses:
        '200':
          description: Incidents with endpoint identity and per-channel delivery status
  /api/admin/organizations/{organizationId}/requests:
    get:
      tags: [Control plane]
      summary: Search requests and per-deployment attempts
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: serviceId, in: query, schema: { type: string, format: uuid } }
        - { name: deploymentId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [IN_PROGRESS, SUCCEEDED, FAILED] } }
        - { name: failoverOnly, in: query, schema: { type: boolean, default: false } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses: { '200': { description: Filtered request page } }
  /api/admin/organizations/{organizationId}/audit-logs:
    get:
      tags: [Control plane]
      summary: Search immutable audit events for one organization
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { name: action, in: query, schema: { type: string, maxLength: 120 } }
        - { name: resourceType, in: query, schema: { type: string, maxLength: 80 } }
        - { name: actorUserId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Organization-scoped audit event page }
        '403': { $ref: '#/components/responses/ApiError' }
  /api/admin/audit-logs:
    get:
      tags: [Control plane]
      summary: Search audit events across the platform
      description: Platform-administrator or break-glass access only.
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters:
        - { name: action, in: query, schema: { type: string, maxLength: 120 } }
        - { name: resourceType, in: query, schema: { type: string, maxLength: 80 } }
        - { name: actorUserId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Platform-wide audit event page }
        '403': { $ref: '#/components/responses/ApiError' }
  /api/portal/organizations/{organizationId}/usage-overview:
    get:
      summary: Get usage derived from the authenticated user's role
      description: |
        Does not accept a project API-key secret. Developers see requests made with keys they issued,
        project owners and team administrators see every key in projects they manage, and organization
        or platform administrators see the complete selected organization.
      security:
        - AdminBearer: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: projectId
          in: query
          description: Optional project filter within the caller's permitted usage scope.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role-scoped totals, project/service/infrastructure/API-key groups, and recent requests.
        '401':
          description: Login session required.
        '403':
          description: Organization or project usage scope denied.
  /api/portal/organizations/{organizationId}/usage-overview/requests/{requestId}:
    get:
      summary: Get safe metadata for one role-visible request
      description: |
        Returns request type, input/output token counts, cost and currency, routing,
        failover attempts, status, and request identifiers. Prompt and model response
        content are never included in this response.
      security:
        - AdminBearer: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Request metadata within the caller's role-scoped usage visibility.
        '401':
          description: Login session required.
        '403':
          description: Request detail scope denied.
        '404':
          description: Request not found in the organization.
  /api/admin/organizations/{organizationId}/external-providers:
    get:
      tags: [Control plane]
      summary: List administrator-managed external AI providers
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { description: Provider metadata without secret API keys } }
  /api/admin/external-providers:
    post:
      tags: [Control plane]
      summary: Register an external OpenAI-compatible provider
      description: The provider API key is encrypted at rest and is never returned by this API.
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      responses: { '200': { description: Registered provider metadata } }
  /api/admin/external-providers/{providerId}/probe:
    post:
      tags: [Control plane]
      summary: Probe provider connectivity with the stored credential
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ name: providerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Probe status and latency } }
  /api/admin/external-providers/{providerId}/models:
    get:
      tags: [Control plane]
      summary: List explicitly registered models for an external provider
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ name: providerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Registered external deployments } }
    post:
      tags: [Control plane]
      summary: Register a provider model as a routing deployment
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ name: providerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Registered external model deployment } }
  /api/admin/external-providers/{providerId}/models/batch:
    post:
      tags: [Control plane]
      summary: Register selected models from one external provider in one atomic operation
      description: The provider credential remains stored once on the provider and is reused by all registered models. Duplicate model IDs reject the entire batch.
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ name: providerId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [models]
              properties:
                models:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [providerModelId, displayName]
                    properties:
                      providerModelId: { type: string, maxLength: 500 }
                      displayName: { type: string, maxLength: 200 }
                      compatibilityKey: { type: string }
                      contextLength: { type: integer, minimum: 1, nullable: true }
                      maxConcurrency: { type: integer, minimum: 1, nullable: true }
                      capabilitiesJson: { type: string, description: JSON-encoded string array }
                      inputPricePerMillion: { type: number, minimum: 0, nullable: true }
                      outputPricePerMillion: { type: number, minimum: 0, nullable: true }
                      currency: { type: string, enum: [KRW, USD] }
      responses: { '200': { description: Registered external model deployments } }
  /api/portal/projects/{projectId}/external-access:
    get:
      tags: [Control plane]
      summary: List external-provider access visible to a project member
      security: [{ AdminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses: { '200': { description: Project access requests and approved policy } }
    post:
      tags: [Control plane]
      summary: Request use of an administrator-managed external provider
      security: [{ AdminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses: { '200': { description: Created or updated access request } }
  /api/admin/organizations/{organizationId}/external-access:
    get:
      tags: [Control plane]
      summary: List project requests for external-provider access
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { description: Organization access-request queue } }
  /api/admin/projects/{projectId}/external-access/{providerId}:
    patch:
      tags: [Control plane]
      summary: Directly grant, approve, reject, or revoke external-provider access and set manual/automatic routing policy
      description: Automatic external failover remains disabled unless autoFailoverEnabled is explicitly approved.
      security: [{ AdminBearer: [] }, { BreakGlassAdmin: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Updated project external-access policy } }
  /api/me/usage:
    get:
      tags: [Usage]
      summary: Get authenticated API key usage totals for a date range
      security: [{ ProjectApiKey: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses: { '200': { description: Token, request, error, and cost totals } }
  /api/me/requests:
    get:
      tags: [Usage]
      summary: Get the latest requests for the authenticated API key
      security: [{ ProjectApiKey: [] }]
      responses:
        '200':
          description: Latest 50 requests for this API key with logical service, stream mode, usage, latency, failover count and normalized error fields; deployment and provider details are excluded
  /api/me/requests/{requestId}:
    get:
      tags: [Usage]
      summary: Get safe metadata for one request made with the authenticated API key
      description: |
        Returns normalized request type, input/output token counts, cost and currency,
        latency, failover count, status, and request identifiers. Provider details,
        routing diagnostics, prompt and model response content are not included.
      security: [{ ProjectApiKey: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Request metadata for the authenticated API key }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/auth/totp/setup:
    post:
      tags: [Authentication]
