services:
  tailscale:
    image: tailscale/tailscale:v1.98.8
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-aiconnect-gateway}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SOCKS5_SERVER: ":1055"
      TS_OUTBOUND_HTTP_PROXY_LISTEN: ":1055"
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: ":9002"
    volumes:
      - tailscale-state:/var/lib/tailscale
    expose: ["1055", "9002"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [internal]

  api:
    environment:
      RUNTIME_HTTP_PROXY_URL: http://tailscale:1055
    depends_on:
      tailscale:
        condition: service_healthy

volumes:
  tailscale-state:
