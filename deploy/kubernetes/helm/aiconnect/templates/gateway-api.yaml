{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
spec:
  gatewayClassName: {{ required "gateway.className is required" .Values.gateway.className }}
  listeners:
    - name: {{ .Values.gateway.listenerName }}
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gateway.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateway.tlsSecretName }}
{{- end }}
{{- if .Values.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "aiconnect.fullname" . }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentGatewayName }}
      {{- if .Values.httpRoute.parentGatewayNamespace }}
      namespace: {{ .Values.httpRoute.parentGatewayNamespace }}
      {{- end }}
  hostnames: [{{ .Values.httpRoute.hostname | quote }}]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
        - path: { type: PathPrefix, value: /v1 }
      backendRefs:
        - name: {{ include "aiconnect.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ include "aiconnect.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port }}
{{- end }}
