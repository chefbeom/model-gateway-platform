# Use this overlay when MariaDB and Redis run outside the HA Compose host.
#
# The base HA file still contains the bundled services so the normal HA
# deployment remains unchanged. This overlay puts those services behind a
# profile and removes the API dependency edges that would otherwise require
# the bundled health checks before either Gateway can start.
services:
  mariadb:
    profiles:
      - embedded-data

  redis:
    profiles:
      - embedded-data

  api-1:
    environment:
      DB_URL: "jdbc:mariadb://${DB_HOST:?set DB_HOST in the external data env file}:${DB_PORT:?set DB_PORT in the external data env file}/${DB_NAME:?set DB_NAME in the external data env file}"
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in the external data env file}
      REDIS_HOST: ${REDIS_HOST:?set REDIS_HOST in the external data env file}
      REDIS_PORT: ${REDIS_PORT:?set REDIS_PORT in the external data env file}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the external data env file}
      REDIS_HEALTH_ENABLED: ${REDIS_HEALTH_ENABLED:-true}
    depends_on: !reset []

  api-2:
    environment:
      DB_URL: "jdbc:mariadb://${DB_HOST:?set DB_HOST in the external data env file}:${DB_PORT:?set DB_PORT in the external data env file}/${DB_NAME:?set DB_NAME in the external data env file}"
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in the external data env file}
      REDIS_HOST: ${REDIS_HOST:?set REDIS_HOST in the external data env file}
      REDIS_PORT: ${REDIS_PORT:?set REDIS_PORT in the external data env file}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the external data env file}
      REDIS_HEALTH_ENABLED: ${REDIS_HEALTH_ENABLED:-true}
    depends_on: !reset []
