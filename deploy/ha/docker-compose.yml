x-api-common: &api-common
  build:
    context: ../..
  restart: unless-stopped
  environment: &api-environment
    DB_URL: jdbc:mariadb://mariadb:3306/aiconnect
    DB_USERNAME: aiconnect
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
    API_KEY_PEPPER: ${API_KEY_PEPPER:?set API_KEY_PEPPER}
    GATEWAY_ENCRYPTION_KEY: ${GATEWAY_ENCRYPTION_KEY:?set GATEWAY_ENCRYPTION_KEY}
    AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:?set AUTH_SIGNING_KEY}
    AUTH_REFRESH_PEPPER: ${AUTH_REFRESH_PEPPER:?set AUTH_REFRESH_PEPPER}
    AICONNECT_DEPLOYMENT_PROFILE: HA
    AICONNECT_SHARED_STATE_PROVIDER: REDIS
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    REDIS_HEALTH_ENABLED: "true"
    HEALTH_CHECK_DELAY_MS: ${HEALTH_CHECK_DELAY_MS:-30000}
    HEALTH_CHECK_INITIAL_DELAY_MS: ${HEALTH_CHECK_INITIAL_DELAY_MS:-30000}
    RUNTIME_CONNECT_TIMEOUT_MS: ${RUNTIME_CONNECT_TIMEOUT_MS:-3000}
    RUNTIME_RESPONSE_TIMEOUT_MS: ${RUNTIME_RESPONSE_TIMEOUT_MS:-360000}
    GATEWAY_INTERNAL_BASE_URL: ${GATEWAY_INTERNAL_BASE_URL:-}
    GATEWAY_EXTERNAL_BASE_URL: ${GATEWAY_EXTERNAL_BASE_URL:-}
  expose: ["8080"]
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s
  networks: [internal]

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: aiconnect
      MARIADB_USER: aiconnect
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD}
    volumes: ["mariadb-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    networks: [internal]

  api-1:
    <<: *api-common
    environment:
      <<: *api-environment
      AICONNECT_INSTANCE_ID: gateway-1

  api-2:
    <<: *api-common
    environment:
      <<: *api-environment
      AICONNECT_INSTANCE_ID: gateway-2

  frontend:
    build:
      context: ../../frontend
    restart: unless-stopped
    expose: ["80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal]

  load-balancer:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.4.2
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose: ["9090"]
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    networks: [internal]

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  mariadb-data:
  redis-data:
  prometheus-data:
  grafana-data:
