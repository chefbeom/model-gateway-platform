# Staging configuration: bind the container to loopback until public ingress,
# Cloudflare source ranges, authentication and rollback have been verified.
# cf-realip.conf must contain ONLY current Cloudflare set_real_ip_from entries.
include /etc/nginx/aiconnect/cf-realip.conf;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;
limit_req_zone $binary_remote_addr zone=public_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=public_refresh:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=public_api:10m rate=600r/m;
# Client certificate is separate from the server's Origin CA certificate.
# Global AOP is shared across Cloudflare accounts; it does not authenticate
# this zone by itself. Network and application controls remain required.
ssl_client_certificate /etc/nginx/aiconnect/aop-client-ca.pem;
ssl_verify_client on;

upstream public_api {
    least_conn;
    server api-1:8080 max_fails=2 fail_timeout=10s;
    server api-2:8080 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/nginx/aiconnect/tls/origin.crt;
    ssl_certificate_key /etc/nginx/aiconnect/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    return 444;
}

server {
    listen 443 ssl;
    server_name www.aiconnectgateway.com;
    # Cloudflare keeps idle origin connections open for up to 900s. Outlive that so Cloudflare, not the
    # origin, closes idle connections: fewer new TCP/TLS handshakes and no race on a just-closed connection.
    keepalive_timeout 960s;
    keepalive_requests 10000;
    ssl_certificate /etc/nginx/aiconnect/tls/origin.crt;
    ssl_certificate_key /etc/nginx/aiconnect/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 10m;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The internal HTTP gateway still issues a non-Secure refresh cookie for
    # Tailnet access. Harden that cookie at the HTTPS-only public boundary.
    proxy_cookie_flags ~ secure httponly samesite=strict;

    location ^~ /api/auth/bootstrap { return 404; }
    location ^~ /api/admin/users { return 404; }
    location ~ ^/api/auth/(login|invitations|totp)(/|$) {
        limit_req zone=public_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/aiconnect/public-proxy-headers.conf;
        proxy_pass http://public_api;
    }
    location ~ ^/api/auth/(refresh|logout)(/|$) {
        limit_req zone=public_refresh burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/aiconnect/public-proxy-headers.conf;
        proxy_pass http://public_api;
    }
    location ~ ^/api/(auth|admin|me|portal)/ {
        limit_req zone=public_api burst=150 nodelay;
        limit_req_status 429;
        include /etc/nginx/aiconnect/public-proxy-headers.conf;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_pass http://public_api;
    }
    location ^~ /api/beta/operator/ {
        limit_req zone=public_api burst=150 nodelay;
        limit_req_status 429;
        include /etc/nginx/aiconnect/public-proxy-headers.conf;
        proxy_pass http://public_api;
    }
    location /api/ { return 404; }
    location ^~ /actuator { return 404; }
    # The in-console API playground uses same-origin /v1.
    include /etc/nginx/aiconnect/public-v1-locations.conf;
    location /v1/ { return 404; }
    location / {
        include /etc/nginx/aiconnect/public-proxy-headers.conf;
        proxy_pass http://frontend:80;
    }
}

server {
    listen 443 ssl;
    server_name api.aiconnectgateway.com;
    # Cloudflare keeps idle origin connections open for up to 900s. Outlive that so Cloudflare, not the
    # origin, closes idle connections: fewer new TCP/TLS handshakes and no race on a just-closed connection.
    keepalive_timeout 960s;
    keepalive_requests 10000;
    ssl_certificate /etc/nginx/aiconnect/tls/origin.crt;
    ssl_certificate_key /etc/nginx/aiconnect/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 10m;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    include /etc/nginx/aiconnect/public-v1-locations.conf;
    location / { return 404; }
}
