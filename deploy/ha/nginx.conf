limit_req_zone $binary_remote_addr zone=aiconnect_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=aiconnect_refresh:10m rate=30r/m;

upstream aiconnect_api {
    least_conn;
    server api-1:8080 max_fails=2 fail_timeout=10s;
    server api-2:8080 max_fails=2 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;
    proxy_set_header X-AIConnect-Beta-Ingress "";

    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /v1/ {
        proxy_pass http://aiconnect_api;
        proxy_http_version 1.1;
        proxy_set_header X-AIConnect-Beta-Ingress "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/api/auth/(login|bootstrap|invitations|totp)(/|$) {
        client_max_body_size 64k;
        limit_req zone=aiconnect_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://aiconnect_api;
        proxy_http_version 1.1;
        proxy_set_header X-AIConnect-Beta-Ingress "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_next_upstream off;
    }

    location ~ ^/api/auth/(refresh|logout)(/|$) {
        client_max_body_size 64k;
        limit_req zone=aiconnect_refresh burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://aiconnect_api;
        proxy_http_version 1.1;
        proxy_set_header X-AIConnect-Beta-Ingress "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_next_upstream off;
    }

    location /api/ {
        proxy_pass http://aiconnect_api;
        proxy_http_version 1.1;
        proxy_set_header X-AIConnect-Beta-Ingress "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location ^~ /actuator {
        return 404;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header X-AIConnect-Beta-Ingress "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
