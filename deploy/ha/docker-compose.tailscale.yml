x-tailscale-common: &tailscale-common
  image: tailscale/tailscale:v1.98.8
  restart: unless-stopped
  environment: &tailscale-environment
    TS_AUTHKEY: ${TS_AUTHKEY:?set a reusable preauthorized TS_AUTHKEY}
    TS_STATE_DIR: /var/lib/tailscale
    TS_USERSPACE: "true"
    TS_SOCKS5_SERVER: ":1055"
    TS_OUTBOUND_HTTP_PROXY_LISTEN: ":1055"
    TS_ACCEPT_DNS: "true"
    TS_AUTH_ONCE: "true"
    TS_ENABLE_HEALTH_CHECK: "true"
    TS_LOCAL_ADDR_PORT: ":9002"
  expose: ["1055", "9002"]
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9002/healthz"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s
  networks: [internal]

services:
  tailscale-1:
    <<: *tailscale-common
    hostname: ${TS_HOSTNAME_1:-aiconnect-gateway-1}
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: ${TS_HOSTNAME_1:-aiconnect-gateway-1}
    volumes: ["tailscale-state-1:/var/lib/tailscale"]

  tailscale-2:
    <<: *tailscale-common
    hostname: ${TS_HOSTNAME_2:-aiconnect-gateway-2}
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: ${TS_HOSTNAME_2:-aiconnect-gateway-2}
    volumes: ["tailscale-state-2:/var/lib/tailscale"]

  api-1:
    environment:
      RUNTIME_HTTP_PROXY_URL: http://tailscale-1:1055
    depends_on:
      tailscale-1:
        condition: service_healthy

  api-2:
    environment:
      RUNTIME_HTTP_PROXY_URL: http://tailscale-2:1055
    depends_on:
      tailscale-2:
        condition: service_healthy

volumes:
  tailscale-state-1:
  tailscale-state-2:
