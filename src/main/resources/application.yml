spring:
  application:
    name: aiconnect-llm-gateway
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/aiconnect}
    username: ${DB_USERNAME:aiconnect}
    password: ${DB_PASSWORD:aiconnect}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  admin-token: ${ADMIN_API_TOKEN:change-me-before-production}
  api-key-pepper: ${API_KEY_PEPPER:change-me-before-production}
  health-check-delay-ms: ${HEALTH_CHECK_DELAY_MS:30000}
  connect-timeout-ms: ${RUNTIME_CONNECT_TIMEOUT_MS:3000}
  response-timeout-ms: ${RUNTIME_RESPONSE_TIMEOUT_MS:120000}
