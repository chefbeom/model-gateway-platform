spring:
  application:
    name: aiconnect-llm-gateway
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/aiconnect}
    username: ${DB_USERNAME:aiconnect}
    password: ${DB_PASSWORD:aiconnect}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

aiconnect:
  deployment:
    profile: ${AICONNECT_DEPLOYMENT_PROFILE:STANDALONE}
    shared-state-provider: ${AICONNECT_SHARED_STATE_PROVIDER:LOCAL}
    instance-id: ${AICONNECT_INSTANCE_ID:${HOSTNAME:standalone-1}}
    lock-ttl: ${AICONNECT_DISTRIBUTED_LOCK_TTL:PT2M}
    active-request-counter-ttl: ${AICONNECT_ACTIVE_REQUEST_COUNTER_TTL:PT2M}
    active-request-heartbeat-ms: ${AICONNECT_ACTIVE_REQUEST_HEARTBEAT_MS:30000}

gateway:
  admin-token: ${ADMIN_API_TOKEN:change-me-before-production}
  api-key-pepper: ${API_KEY_PEPPER:change-me-before-production}
  health-check-delay-ms: ${HEALTH_CHECK_DELAY_MS:30000}
  health-check-initial-delay-ms: ${HEALTH_CHECK_INITIAL_DELAY_MS:30000}
  connect-timeout-ms: ${RUNTIME_CONNECT_TIMEOUT_MS:3000}
  # Keep this longer than a caller's own response timeout. Local GPU inference
  # can take several minutes for long, non-streaming completions.
  response-timeout-ms: ${RUNTIME_RESPONSE_TIMEOUT_MS:360000}
