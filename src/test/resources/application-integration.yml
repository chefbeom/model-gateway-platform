spring:
  datasource:
    url: jdbc:h2:mem:aiconnect;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
gateway:
  admin-token: integration-admin-token
  api-key-pepper: integration-pepper
  encryption-key: integration-encryption-key
  health-check-delay-ms: 3600000
  connect-timeout-ms: 1000
  response-timeout-ms: 1000
