spring:
  datasource:
    url: jdbc:h2:mem:aiconnect;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # H2 does not implement every MariaDB ALTER TABLE form used by the
      # production Flyway history. Integration tests exercise application
      # behaviour against an isolated schema; production migration execution
      # remains verified against MariaDB during deployment preflight.
      ddl-auto: create-drop
  flyway:
    enabled: false
gateway:
  admin-token: integration-admin-token
  api-key-pepper: integration-pepper
  encryption-key: integration-encryption-key
  health-check-delay-ms: 3600000
  health-check-initial-delay-ms: 3600000
  connect-timeout-ms: 1000
  response-timeout-ms: 1000
